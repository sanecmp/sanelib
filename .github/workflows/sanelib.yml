name: Sanelib

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python 3.12
        run: uv python install "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" --group tests pytest -q
